# ==============================================================================
# HorRAGore v3 — Pipeline CD (Continuous Deployment)
# ==============================================================================

name: HorRAGore CD

on:
  push:
    branches: [main]

env:
  OWNER: annavitry

jobs:
  build-push-api:
    name: 🐳 Build & Push API
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et Push image API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/horragor-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/horragor-api:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/horragor-api:latest
            ghcr.io/${{ env.OWNER }}/horragor-api:${{ github.sha }}

  build-push-frontend:
    name: 🐳 Build & Push Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et Push image Frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/horragor-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/horragor-frontend:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/horragor-frontend:latest
            ghcr.io/${{ env.OWNER }}/horragor-frontend:${{ github.sha }}