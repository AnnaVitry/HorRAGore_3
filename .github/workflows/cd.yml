# ==============================================================================
# HorRAGore v3 — Pipeline CD (Continuous Deployment)
#
# Déclenché sur : Push sur main (après merge d'une PR)
#
# Jobs :
#   1. build-push-api      : Build et push l'image API sur Docker Hub
#   2. build-push-frontend : Build et push l'image Frontend sur Docker Hub
# ==============================================================================

name: HorRAGore CD

on:
  push:
    branches: [main]

jobs:
  # ============================================================================
  # JOB 1 : Build et Push image API
  # ============================================================================
  build-push-api:
    name: 🐳 Build & Push API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et Push image API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/horragor-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/horragor-api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner | lower }}/horragor-api:latest
            ghcr.io/${{ github.repository_owner | lower }}/horragor-api:${{ github.sha }}

  # ============================================================================
  # JOB 2 : Build et Push image Frontend
  # ============================================================================
  build-push-frontend:
    name: 🐳 Build & Push Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build et Push image Frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/horragor-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/horragor-frontend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner | lower }}/horragor-frontend:latest
            ghcr.io/${{ github.repository_owner | lower }}/horragor-frontend:${{ github.sha }}